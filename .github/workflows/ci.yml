name: CI

# Pushes run only on master; branches are checked through their PR. Triggering on
# every push as well ran the same job twice for each push to a PR branch.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Playwright UI tests are local only (`pnpm test:ui`); CI runs the fast checks.
jobs:
  test:
    runs-on: ubuntu-24.04
    # Actions are pinned to commit SHAs: a tag like v7 can be moved to other code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      # postinstall builds shared/wanikani-kanji.json, which isn't committed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
